name: Auto Rollout Update

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main]  # 针对 master 的 push 触发
    paths:
      - 'dist/**'
  pull_request:
    types:  # 针对 master 的 PR 被 Merge 后触发
      - closed
    branches: [main]
    paths:
      - 'dist/**'

jobs:
  buildImage:
    runs-on: docker-cli
    steps:
      - name: Clone repository code
        shell: sh
        run:
          git clone https://${{ secrets.R_USER }}:${{ secrets.R_PASSWORD }}@git.lan.tuf3i.cc/JuanNiangDev/JuanNiang-Docs.git .

      - name: Docker Build
        shell: sh
        run:
          docker build --pull --no-cache -t ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME_LOWER }}/juan-dev/juan-docs:latest .

      - name: Docker Push
        shell: sh
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${{ secrets.REGISTRY_URL }}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
          docker push ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME_LOWER }}/juan-dev/juan-docs:latest

      - name: Docker Clean
        shell: sh
        run:
          docker rmi ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME_LOWER }}/juan-dev/juan-docs:latest || true
  rolloutUpdate:
    runs-on: kubectl-cli
    steps:
      - name: Setup kubeconfig
        shell: sh
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
      - name: Rollout Update
        shell: sh
        run:
          kubectl rollout restart deployment/juan-docs -n juan-dev
      - name: Wait For Update
        shell: sh
        run:
          kubectl rollout status deployment/juan-docs -n juan-dev --timeout=300s
