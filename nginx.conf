# JuanNiang-Docs nginx 配置
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 健康检查（Docker HEALTHCHECK 使用）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 站点主体：Docusaurus 静态生成（trailingSlash: false → .html 文件），
    # 依次尝试 原路径 → .html → 目录，未命中返回 404（显示 Docusaurus 自定义 404 页，不回落首页）
    location / {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /404.html;
    }

    # 带哈希指纹的静态资源：长缓存；缺失文件直接 404，不走 HTML 回退
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
